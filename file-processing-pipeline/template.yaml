AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless File-Processing Pipeline
  S3 upload triggers Lambda (image resize / PDF parsing), metadata stored in DynamoDB,
  status API + static dashboard for viewing results

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        TABLE_NAME: !Ref FileMetadataTable
        PROCESSED_BUCKET: !Ref ProcessedBucket
  Api:
    Cors:
      AllowMethods: "'GET,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:

  # ---------- Processed Bucket ----------
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "file-pipeline-processed-${AWS::AccountId}"

  # ---------- DynamoDB Table ----------
  FileMetadataTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: FileMetadata
      PrimaryKey:
        Name: fileId
        Type: String

  # ---------- Image Resize Lambda ----------
  ImageResizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: image-resize/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "file-pipeline-uploads-${AWS::AccountId}"
        - S3CrudPolicy:
            BucketName: !Ref ProcessedBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref FileMetadataTable

  # ---------- PDF Parse Lambda ----------
  PdfParseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: pdf-parse/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "file-pipeline-uploads-${AWS::AccountId}"
        - S3CrudPolicy:
            BucketName: !Ref ProcessedBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref FileMetadataTable

  # ---------- Status API Lambda ----------
  StatusApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: status-api/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FileMetadataTable
      Events:
        GetFiles:
          Type: Api
          Properties:
            Path: /files
            Method: GET

  # ---------- Permissions letting S3 invoke each processing Lambda ----------
  ImageResizeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ImageResizeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::file-pipeline-uploads-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  PdfParseFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PdfParseFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::file-pipeline-uploads-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # ---------- Upload Bucket (created LAST, with manual notification config) ----------
  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - ImageResizeFunctionPermission
      - PdfParseFunctionPermission
    Properties:
      BucketName: !Sub "file-pipeline-uploads-${AWS::AccountId}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .jpg
            Function: !GetAtt ImageResizeFunction.Arn
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf
            Function: !GetAtt PdfParseFunction.Arn

  # ---------- Dashboard Hosting Bucket ----------
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "file-pipeline-dashboard-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::file-pipeline-dashboard-${AWS::AccountId}/*"

Outputs:
  UploadBucketName:
    Value: !Ref UploadBucket
  ProcessedBucketName:
    Value: !Ref ProcessedBucket
  MetadataTableName:
    Value: !Ref FileMetadataTable
  StatusApiUrl:
    Description: "Base URL for the status API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/files"
  DashboardBucketName:
    Value: !Ref DashboardBucket
  DashboardUrl:
    Description: "Public URL for the dashboard"
    Value: !Sub "http://file-pipeline-dashboard-${AWS::AccountId}.s3-website.${AWS::Region}.amazonaws.com"